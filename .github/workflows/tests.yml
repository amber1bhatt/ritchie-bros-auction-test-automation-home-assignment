name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (overrides the BASE_URL variable)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # dispatch input > repo variable > prod
  BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://www.rbauction.com' }}

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  tests:
    name: Playwright tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # headed needs a display (xvfb). non-blocking because the WAF may block CI IPs
      - name: Run tests
        continue-on-error: true
        run: xvfb-run -a npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
